<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人權之路 - 棋盤桌遊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', '微軟正黑體', sans-serif;
            background: linear-gradient(45deg, #1e3c72, #2a5298, #6a85b6, #bac8e0);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.1) 10px,
                rgba(255,255,255,0.1) 20px
            );
            animation: moveStripes 20s linear infinite;
        }

        @keyframes moveStripes {
            0% { transform: translateX(-50px); }
            100% { transform: translateX(50px); }
        }

        .game-title {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        .game-subtitle {
            font-size: 1.3em;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }

        .game-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            padding: 30px;
        }

        .board-container {
            position: relative;
        }

        .game-board {
            width: 100%;
            max-width: 700px;
            aspect-ratio: 1;
            background: #2c3e50;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .board-path {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 8px solid #3498db;
            border-radius: 15px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
        }

        .board-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .center-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .center-subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .board-space {
            position: absolute;
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid #3498db;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .board-space:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .board-space.current {
            background: #f39c12;
            color: white;
            transform: scale(1.2);
            box-shadow: 0 10px 20px rgba(243, 156, 18, 0.4);
        }

        .board-space.visited {
            background: #27ae60;
            color: white;
        }

        .player-piece {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #e74c3c;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            z-index: 10;
        }

        .sidebar {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .player-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .player-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .player-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .player-level {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .game-stats {
            margin-bottom: 30px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ecf0f1;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .stat-value {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .badges-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .badge {
            aspect-ratio: 1;
            background: #ecf0f1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .badge.earned {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .badge.earned::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 2s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .controls {
            text-align: center;
        }

        .dice-container {
            margin-bottom: 20px;
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid #3498db;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .dice:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .dice.rolling {
            animation: rollDice 1s ease-in-out;
        }

        @keyframes rollDice {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1.2); }
            75% { transform: rotate(270deg) scale(1.1); }
        }

        .roll-button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            width: 100%;
        }

        .roll-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .roll-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .event-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .event-modal.show .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .modal-text {
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .modal-button {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .game-content {
                grid-template-columns: 1fr;
            }
            
            .game-board {
                max-width: 400px;
                margin: 0 auto;
            }
            
            .board-space {
                width: 50px;
                height: 50px;
                font-size: 0.6em;
            }
            
            .board-center {
                width: 200px;
                height: 200px;
            }
            
            .center-title {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🛡️ 人權之路</h1>
            <p class="game-subtitle">踏上人權學習的冒險旅程，收集人權徽章成為真正的守護者！</p>
        </div>

        <div class="game-content">
            <div class="board-container">
                <div class="game-board" id="gameBoard">
                    <div class="board-path"></div>
                    <div class="board-center">
                        <div class="center-title">人權之路</div>
                        <div class="center-subtitle">學習 • 成長 • 守護</div>
                    </div>
                    <div class="player-piece" id="playerPiece">🚶</div>
                </div>
            </div>

            <div class="sidebar">
                <div class="player-info">
                    <div class="player-avatar">👤</div>
                    <div class="player-name" id="playerName">人權學習者</div>
                    <div class="player-level" id="playerLevel">初學者</div>
                </div>

                <div class="game-stats">
                    <div class="stat-item">
                        <span class="stat-label">當前位置</span>
                        <span class="stat-value" id="currentPosition">起點</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">學習點數</span>
                        <span class="stat-value" id="learningPoints">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">完成回合</span>
                        <span class="stat-value" id="completedRounds">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">獲得徽章</span>
                        <span class="stat-value" id="earnedBadges">0/9</span>
                    </div>
                </div>

                <div class="badges-section">
                    <div class="section-title">人權徽章收集</div>
                    <div class="badges-grid" id="badgesGrid">
                        <div class="badge" title="言論自由">🗣️</div>
                        <div class="badge" title="教育權">📚</div>
                        <div class="badge" title="工作權">💼</div>
                        <div class="badge" title="隱私權">🔒</div>
                        <div class="badge" title="宗教自由">🕊️</div>
                        <div class="badge" title="居住權">🏠</div>
                        <div class="badge" title="健康權">❤️</div>
                        <div class="badge" title="集會自由">✊</div>
                        <div class="badge" title="平等權">⚖️</div>
                    </div>
                </div>

                <div class="controls">
                    <div class="dice-container">
                        <div class="dice" id="dice">?</div>
                    </div>
                    <button class="roll-button" id="rollButton" onclick="rollDice()">
                        擲骰子開始冒險！
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 事件彈窗 -->
    <div class="event-modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎯</div>
            <div class="modal-title" id="modalTitle">事件標題</div>
            <div class="modal-text" id="modalText">事件內容</div>
            <button class="modal-button" onclick="closeModal()">繼續冒險</button>
        </div>
    </div>

    <script>
        // 遊戲狀態
        let gameState = {
            playerPosition: 0,
            learningPoints: 0,
            completedRounds: 0,
            earnedBadges: new Set(),
            visitedSpaces: new Set(),
            isRolling: false
        };

        // 棋盤空間定義
        const boardSpaces = [
            { name: "起點", type: "start", icon: "🏁", description: "人權學習的起點" },
            { name: "言論自由", type: "learning", icon: "🗣️", badge: 0 },
            { name: "機會", type: "chance", icon: "❓" },
            { name: "教育權", type: "learning", icon: "📚", badge: 1 },
            { name: "挑戰", type: "challenge", icon: "⚡" },
            { name: "工作權", type: "learning", icon: "💼", badge: 2 },
            { name: "休息站", type: "rest", icon: "☕" },
            { name: "隱私權", type: "learning", icon: "🔒", badge: 3 },
            { name: "機會", type: "chance", icon: "❓" },
            { name: "宗教自由", type: "learning", icon: "🕊️", badge: 4 },
            { name: "挑戰", type: "challenge", icon: "⚡" },
            { name: "居住權", type: "learning", icon: "🏠", badge: 5 },
            { name: "轉角", type: "corner", icon: "🔄" },
            { name: "健康權", type: "learning", icon: "❤️", badge: 6 },
            { name: "機會", type: "chance", icon: "❓" },
            { name: "集會自由", type: "learning", icon: "✊", badge: 7 },
            { name: "挑戰", type: "challenge", icon: "⚡" },
            { name: "平等權", type: "learning", icon: "⚖️", badge: 8 },
            { name: "終點獎勵", type: "bonus", icon: "🎁" },
            { name: "人權大師", type: "master", icon: "👑" }
        ];

        // 事件內容
        const events = {
            learning: [
                {
                    title: "學習成功！",
                    text: "你深入了解了這項人權的重要性，獲得了寶貴的知識！",
                    icon: "🎓",
                    points: 10
                }
            ],
            chance: [
                {
                    title: "偶遇人權活動家",
                    text: "你遇到了一位經驗豐富的人權活動家，他分享了許多寶貴經驗！",
                    icon: "👨‍🏫",
                    points: 5
                },
                {
                    title: "參與社區討論",
                    text: "你參加了一場關於人權的社區討論會，學到了不同觀點！",
                    icon: "💬",
                    points: 8
                },
                {
                    title: "閱讀人權文獻",
                    text: "你找到了一本珍貴的人權書籍，增進了理論知識！",
                    icon: "📖",
                    points: 6
                }
            ],
            challenge: [
                {
                    title: "面對困難情境",
                    text: "你遇到了一個複雜的人權問題，雖然困難但讓你更加成熟！",
                    icon: "💪",
                    points: 3
                },
                {
                    title: "克服偏見",
                    text: "你成功克服了內心的偏見，學會了更包容的態度！",
                    icon: "🤝",
                    points: 7
                }
            ],
            rest: [
                {
                    title: "在咖啡廳休息",
                    text: "你在舒適的環境中思考學到的人權知識，整理思緒！",
                    icon: "☕",
                    points: 4
                }
            ],
            corner: [
                {
                    title: "轉換視角",
                    text: "你從不同角度重新審視人權問題，獲得了新的洞察！",
                    icon: "🔄",
                    points: 5
                }
            ],
            bonus: [
                {
                    title: "特別獎勵！",
                    text: "恭喜你完成了一輪學習！你的堅持值得嘉獎！",
                    icon: "🎁",
                    points: 15
                }
            ],
            master: [
                {
                    title: "人權大師！",
                    text: "你已經成為真正的人權專家！繼續傳播人權知識吧！",
                    icon: "👑",
                    points: 20
                }
            ]
        };

        // 初始化遊戲
        function initGame() {
            createBoard();
            updateUI();
            positionPlayer();
        }

        // 創建棋盤
        function createBoard() {
            const board = document.getElementById('gameBoard');
            const boardSize = board.offsetWidth;
            const spaceSize = 80;
            const spaces = boardSpaces.length;
            
            boardSpaces.forEach((space, index) => {
                const spaceElement = document.createElement('div');
                spaceElement.className = 'board-space';
                spaceElement.id = `space-${index}`;
                spaceElement.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 5px;">${space.icon}</div>
                    <div style="font-size: 0.7em; line-height: 1.1;">${space.name}</div>
                `;
                
                // 計算位置（圓形排列）
                const angle = (index / spaces) * 2 * Math.PI - Math.PI / 2;
                const radius = (boardSize - spaceSize) / 2 - 40;
                const x = Math.cos(angle) * radius + boardSize / 2 - spaceSize / 2;
                const y = Math.sin(angle) * radius + boardSize / 2 - spaceSize / 2;
                
                spaceElement.style.left = x + 'px';
                spaceElement.style.top = y + 'px';
                
                board.appendChild(spaceElement);
            });
        }

        // 擲骰子
        function rollDice() {
            if (gameState.isRolling) return;
            
            gameState.isRolling = true;
            const dice = document.getElementById('dice');
            const rollButton = document.getElementById('rollButton');
            
            dice.classList.add('rolling');
            rollButton.disabled = true;
            rollButton.textContent = '擲骰中...';
            
            // 動畫效果
            let rollCount = 0;
            const rollInterval = setInterval(() => {
                dice.textContent = Math.floor(Math.random() * 6) + 1;
                rollCount++;
                
                if (rollCount > 10) {
                    clearInterval(rollInterval);
                    const finalRoll = Math.floor(Math.random() * 6) + 1;
                    dice.textContent = finalRoll;
                    dice.classList.remove('rolling');
                    
                    setTimeout(() => {
                        movePlayer(finalRoll);
                        gameState.isRolling = false;
                        rollButton.disabled = false;
                        rollButton.textContent = '再次擲骰子';
                    }, 500);
                }
            }, 100);
        }

        // 移動玩家
        function movePlayer(steps) {
            const oldPosition = gameState.playerPosition;
            gameState.playerPosition = (gameState.playerPosition + steps) % boardSpaces.length;
            
            // 檢查是否完成一輪
            if (oldPosition + steps >= boardSpaces.length) {
                gameState.completedRounds++;
            }
            
            // 標記為已訪問
            gameState.visitedSpaces.add(gameState.playerPosition);
            
            // 更新視覺效果
            updateSpaceVisuals();
            positionPlayer();
            
            // 觸發事件
            setTimeout(() => {
                triggerSpaceEvent(gameState.playerPosition);
                updateUI();
            }, 600);
        }

        // 定位玩家
        function positionPlayer() {
            const player = document.getElementById('playerPiece');
            const space = document.getElementById(`space-${gameState.playerPosition}`);
            
            if (space) {
                const rect = space.getBoundingClientRect();
                const boardRect = document.getElementById('gameBoard').getBoundingClientRect();
                
                const x = rect.left - boardRect.left + rect.width / 2 - 15;
                const y = rect.top - boardRect.top + rect.height / 2 - 15;
                
                player.style.left = x + 'px';
                player.style.top = y + 'px';
            }
        }

        // 更新空間視覺效果
        function updateSpaceVisuals() {
            boardSpaces.forEach((space, index) => {
                const spaceElement = document.getElementById(`space-${index}`);
                spaceElement.classList.remove('current', 'visited');
                
                if (index === gameState.playerPosition) {
                    spaceElement.classList.add('current');
                } else if (gameState.visitedSpaces.has(index)) {
                    spaceElement.classList.add('visited');
                }
            });
        }

        // 觸發空間事件
        function triggerSpaceEvent(spaceIndex) {
            const space = boardSpaces[spaceIndex];
            const eventList = events[space.type];
            
            if (eventList && eventList.length > 0) {
                const event = eventList[Math.floor(Math.random() * eventList.length)];
                gameState.learningPoints += event.points;
                
                // 如果是學習類型，獲得徽章
                if (space.type === 'learning' && space.badge !== undefined) {
                    gameState.earnedBadges.add(space.badge);
                    updateBadges();
                }
                
                showEventModal(event.icon, event.title, event.text);
            }
        }

        // 顯示事件彈窗
        function showEventModal(icon, title, text) {
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            
            const modal = document.getElementById('eventModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        // 關閉彈窗
        function closeModal() {
            const modal = document.getElementById('eventModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        // 更新徽章顯示
        function updateBadges() {
            const badges = document.querySelectorAll('.badge');
            badges.forEach((badge, index) => {
                if (gameState.earnedBadges.has(index)) {
                    badge.classList.add('earned');
                }
            });
        }

        // 更新UI
        function updateUI() {
            document.getElementById('currentPosition').textContent = boardSpaces[gameState.playerPosition].name;
            document.getElementById('learningPoints').textContent = gameState.learningPoints;
            document.getElementById('completedRounds').textContent = gameState.completedRounds;
            document.getElementById('earnedBadges').textContent = `${gameState.earnedBadges.size}/9`;
            
            // 更新玩家等級
            const level = getPlayerLevel(gameState.learningPoints);
            document.getElementById('playerLevel').textContent = level;
        }

        // 獲取玩家等級
        function getPlayerLevel(points) {
            if (points >= 150) return "人權大師 🏆";
            if (points >= 120) return "人權專家 🥇";
            if (points >= 90) return "人權守護者 🛡️";
            if (points >= 60) return "人權支持者 👥";
            if (points >= 30) return "人權學徒 📚";
            return "初學者 🌱";
        }

        // 重置遊戲
        function resetGame() {
            gameState = {
                playerPosition: 0,
                learningPoints: 0,
                completedRounds: 0,
                earnedBadges: new Set(),
                visitedSpaces: new Set(),
                isRolling: false
            };
            
            // 重置視覺效果
            document.querySelectorAll('.board-space').forEach(space => {
                space.classList.remove('current', 'visited');
            });
            
            document.querySelectorAll('.badge').forEach(badge => {
                badge.classList.remove('earned');
            });
            
            document.getElementById('dice').textContent = '?';
            document.getElementById('rollButton').textContent = '擲骰子開始冒險！';
            
            updateUI();
            positionPlayer();
        }

        // 窗口大小改變時重新定位
        window.addEventListener('resize', () => {
            setTimeout(() => {
                positionPlayer();
            }, 100);
        });

        // 遊戲初始化
        window.addEventListener('load', () => {
            initGame();
            
            // 添加鍵盤快捷鍵
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !gameState.isRolling) {
                    e.preventDefault();
                    rollDice();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetGame();
                }
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });

        // 點擊空間顯示詳情
        document.addEventListener('click', (e) => {
            if (e.target.closest('.board-space')) {
                const spaceElement = e.target.closest('.board-space');
                const spaceIndex = parseInt(spaceElement.id.split('-')[1]);
                const space = boardSpaces[spaceIndex];
                
                if (gameState.visitedSpaces.has(spaceIndex) || spaceIndex === gameState.playerPosition) {
                    showSpaceDetails(space, spaceIndex);
                }
            }
        });

        // 顯示空間詳情
        function showSpaceDetails(space, index) {
            let description = space.description || `這是${space.name}，一個重要的人權學習站點。`;
            
            if (space.type === 'learning') {
                description += `\n\n在這裡你可以深入學習${space.name}的相關知識，了解其在現代社會中的重要性和應用。`;
            }
            
            showEventModal(space.icon, space.name, description);
        }

        // 添加成就系統提示
        function checkAchievements() {
            const achievements = [];
            
            if (gameState.completedRounds >= 1 && !localStorage.getItem('achievement_first_round')) {
                achievements.push("🎯 首次完成一輪！");
                localStorage.setItem('achievement_first_round', 'true');
            }
            
            if (gameState.earnedBadges.size >= 5 && !localStorage.getItem('achievement_half_badges')) {
                achievements.push("🏅 獲得一半徽章！");
                localStorage.setItem('achievement_half_badges', 'true');
            }
            
            if (gameState.earnedBadges.size === 9 && !localStorage.getItem('achievement_all_badges')) {
                achievements.push("👑 收集全部徽章！");
                localStorage.setItem('achievement_all_badges', 'true');
            }
            
            if (gameState.learningPoints >= 100 && !localStorage.getItem('achievement_century')) {
                achievements.push("💯 學習點數破百！");
                localStorage.setItem('achievement_century', 'true');
            }
            
            if (achievements.length > 0) {
                setTimeout(() => {
                    showEventModal("🎉", "恭喜達成成就！", achievements.join('\n'));
                }, 1000);
            }
        }

        // 修改movePlayer函數以檢查成就
        const originalMovePlayer = movePlayer;
        movePlayer = function(steps) {
            originalMovePlayer(steps);
            setTimeout(checkAchievements, 1500);
        };
    </script>
</body>
</html>
